<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Su, Kuan-Lun｜Data Constellation Interface</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --ink: #22211f;
      --muted: #6b665f;
      --paper-edge: rgba(70, 62, 50, 0.16);
      --accent: #9b6046;
      --accent-dark: #624236;
      --shadow: 0 28px 80px rgba(47, 38, 28, 0.16);
      --ui-font: "Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
      --body-font: "Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
    }

    body.lang-en {
      --ui-font: "Avenir Next","Segoe UI",Arial,sans-serif;
      --body-font: Georgia,"Times New Roman",serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,0.52), transparent 38%),
        linear-gradient(135deg, #eee8dc 0%, #e4ddcf 48%, #dcd2c3 100%);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: var(--body-font);
    }

    .site {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
    }

    .background-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: auto; /* Allow mouse interaction */
      width: 100%;
      height: 100%;
    }

    .background-overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.36), transparent 22%, transparent 78%, rgba(255,255,255,0.25)),
        radial-gradient(circle at 75% 18%, rgba(255,255,255,0.45), transparent 28%);
      z-index: 1;
      pointer-events: none;
    }

    .main-ui {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(180px, 280px) minmax(360px, 760px);
      justify-content: center;
      align-items: center;
      gap: clamp(28px, 5vw, 92px);
      padding: clamp(28px, 6vw, 72px);
      pointer-events: none; /* Let clicks pass through empty spaces to canvas */
    }

    .tabs, .paper {
      pointer-events: auto; /* Re-enable clicks for UI */
    }

    .tabs {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      transform: translateY(-18px);
    }

    .site-mark {
      width: min(100%, 220px);
      margin-bottom: 28px;
      padding-right: 8px;
      text-align: right;
      color: var(--accent-dark);
      font-family: var(--ui-font);
    }

    .site-mark .name {
      display: block;
      font-size: 1.25rem;
      letter-spacing: 0.16em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .site-mark .desc {
      display: block;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      line-height: 1.75;
      color: var(--muted);
    }

    .school-line {
      width: 32px;
      height: 1px;
      background: rgba(98, 66, 54, 0.2);
      margin: 8px 0 8px auto;
    }

    .school-name {
      font-size: 0.75rem;
      color: #504a42;
      opacity: 1;
      display: block;
      font-weight: 500;
    }

    .tab {
      position: relative;
      width: 178px;
      appearance: none;
      border: 1px solid var(--paper-edge);
      border-right: 0;
      border-radius: 14px 0 0 14px;
      padding: 15px 22px 15px 18px;
      background: linear-gradient(90deg, rgba(255,255,255,0.70), rgba(252,249,240,0.95));
      color: var(--muted);
      box-shadow:
        -10px 16px 38px rgba(52, 42, 30, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.84);
      cursor: pointer;
      font-size: 0.96rem;
      line-height: 1;
      text-align: right;
      letter-spacing: 0.06em;
      font-family: var(--ui-font);
      transition: transform 280ms ease, color 280ms ease, box-shadow 280ms ease, background 280ms ease;
    }

    .tab::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 0;
      width: 18px;
      height: 100%;
      background: inherit;
      border-top: 1px solid var(--paper-edge);
      border-bottom: 1px solid var(--paper-edge);
      transform: skewX(-8deg);
      transform-origin: left;
      opacity: 0.96;
    }

    .tab:hover { transform: translateX(-4px); color: var(--accent-dark); }

    .tab.is-active {
      color: var(--ink);
      background: linear-gradient(90deg, rgba(255,255,255,0.86), rgba(252,249,240,1));
      box-shadow:
        -12px 20px 46px rgba(52, 42, 30, 0.13),
        inset 0 1px 0 rgba(255,255,255,0.92);
      transform: translateX(-8px);
    }

    .paper {
      position: relative;
      width: min(100%, 760px);
      min-height: 550px;
      max-height: min(76vh, 760px);
      padding: clamp(34px, 4.8vw, 62px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.76), transparent 28%),
        linear-gradient(180deg, rgba(252,249,240,0.96), rgba(246,241,230,0.92));
      border: 1px solid var(--paper-edge);
      border-radius: 4px 22px 22px 4px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .paper::before {
      content: "";
      position: absolute;
      top: 0;
      left: 22px;
      width: 1px;
      height: 100%;
      background: rgba(155, 96, 70, 0.18);
    }

    .paper::after {
      content: "";
      position: absolute;
      right: 28px;
      bottom: 24px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid rgba(98, 66, 54, 0.12);
      opacity: 0.55;
    }

    .paper-top {
      position: relative;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .lang-switch {
      display: inline-flex;
      padding: 4px;
      border: 1px solid rgba(98, 66, 54, 0.14);
      background: rgba(255,255,255,0.38);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      font-family: var(--ui-font);
    }

    .lang-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      font-family: var(--ui-font);
      transition: 220ms ease;
    }

    .lang-btn.is-active {
      background: rgba(155, 96, 70, 0.13);
      color: var(--accent-dark);
      font-weight: 600;
    }

    .paper-inner {
      position: relative;
      z-index: 2;
      overflow-y: auto;
      max-height: calc(min(76vh, 760px) - 148px);
      padding-right: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(98, 66, 54, 0.25) transparent;
      scroll-behavior: smooth;
    }

    .paper-inner::-webkit-scrollbar { width: 6px; }
    .paper-inner::-webkit-scrollbar-thumb { background: rgba(98, 66, 54, 0.22); border-radius: 999px; }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: var(--ui-font);
      font-weight: 600;
    }

    h1 {
      max-width: 12em;
      margin: 0 0 22px;
      font-size: clamp(2.05rem, 5vw, 4.25rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      font-weight: 700;
      font-family: var(--ui-font);
    }

    .body-copy {
      max-width: 42em;
      margin: 0;
      white-space: pre-line;
      font-size: clamp(0.98rem, 1.32vw, 1.08rem);
      line-height: 1.98;
      color: #3e3a35;
      font-family: var(--body-font);
      text-align: justify;
    }

    .expertise-block {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(98, 66, 54, 0.12);
    }

    .expertise-block:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .expertise-title {
      margin: 0 0 16px;
      color: var(--accent-dark);
      font-size: clamp(1.15rem, 1.8vw, 1.55rem);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-family: var(--ui-font);
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 26px;
    }

    .keyword {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 7px 12px;
      border: 1px solid rgba(98, 66, 54, 0.16);
      background: rgba(255,255,255,0.38);
      color: var(--accent-dark);
      font-size: 0.79rem;
      letter-spacing: 0.02em;
      font-family: var(--ui-font);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .keyword:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(155, 96, 70, 0.2);
    }

    .status-line {
      position: absolute;
      left: clamp(28px, 5vw, 64px);
      bottom: clamp(20px, 4vw, 42px);
      z-index: 12;
      color: rgba(57, 49, 42, 0.48);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--ui-font);
      pointer-events: none;
    }

    @media (max-width: 860px) {
      .main-ui {
        grid-template-columns: 1fr;
        align-items: start;
        gap: 24px;
        padding: 26px 18px 24px;
      }

      .tabs {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        transform: none;
        order: 1;
        padding-top: 10px;
      }

      .site-mark { 
        width: 100%;
        text-align: center;
        padding-right: 0;
        margin-bottom: 16px;
      }

      .site-mark .name {
        margin-bottom: 4px;
      }

      .school-line {
        margin: 8px auto;
      }

      .tab {
        flex: 1;
        min-width: 120px;
        border-right: 1px solid var(--paper-edge);
        border-radius: 14px;
        text-align: center;
        padding: 14px 18px;
      }

      .tab::after { display: none; }

      .tab.is-active, .tab:hover { transform: translateY(-4px); }

      .paper {
        order: 2;
        min-height: 560px;
        max-height: none;
        border-radius: 18px;
        padding: 30px 26px 42px;
      }

      .paper-top { align-items: flex-start; }
      .paper-inner { max-height: none; overflow: visible; }
      .paper::before { left: 16px; }

      .status-line { 
        position: relative;
        left: auto;
        bottom: auto;
        writing-mode: horizontal-tb;
        text-align: center;
        width: 100%;
        padding: 20px 10px 40px;
      }
    }
  </style>
</head>
<body class="lang-zh">
  <main class="site">
    <!-- New Performant Canvas Background -->
    <canvas id="bg-canvas" class="background-stage"></canvas>
    <div class="background-overlay"></div>

    <section class="main-ui" aria-label="Personal website prototype">
      <nav class="tabs" aria-label="Section navigation">
        <div class="site-mark">
          <span class="name" id="siteName">蘇冠綸</span>
          <span class="desc" id="siteDesc">Su, Kuan-Lun<div class="school-line"></div><span class="school-name">National Chengchi University</span></span>
        </div>

        <button class="tab is-active" type="button" data-view="intro" id="navIntro">自我介紹</button>
        <button class="tab" type="button" data-view="expertise" id="navExpertise">專長領域</button>
      </nav>

      <article class="paper" aria-live="polite">
        <div class="paper-top">
          <p class="eyebrow" id="eyebrow">Profile / 01</p>
          <div class="lang-switch" aria-label="Language switch">
            <button class="lang-btn is-active" type="button" data-lang="zh">中文</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
        </div>
        <div class="paper-inner" id="paperContent"></div>
      </article>
    </section>

    <div class="status-line">© 2026 Su, Kuan-Lun. All rights reserved. ｜ data constellation / dynamic network / v5</div>
  </main>

  <script>
    const contentData = {
      "zh": {
        "name": "蘇冠綸",
        "nameSub": "Su, Kuan-Lun",
        "introTitle": "",
        "introBody": "關注媒介技術如何形塑當代文化實踐，並從互動設計、媒體素養與媒介化研究等面向，探討知識、經驗與公共議題如何被轉譯、呈現與重新理解。以設計學與傳播學為主要學術訓練背景，早期研究聚焦於使用者中心設計、互動經驗、需求分析與情境脈絡的整合，並將相關訓練延伸至數位策展、互動展示與資訊介面設計。曾任職於大學圖書館研發單位，參與圖書館場域轉型、數位服務設計與國際學術合作交流，也曾參與歐盟 Erasmus+ 教職員交換計畫，累積跨機構、跨文化與教育場域中的實務經驗。隨後研究重心逐漸轉向媒體科技、制度實踐與文化再現之間的關係，特別關注 AI 技術與深媒介化環境下，機構、知識與公共議題如何透過論述、介面與展示形式被重新組織。\n\n教學方面，曾擔任設計實務工作坊與媒體素養工作坊講師，並於傳播科系擔任講師，開設《創意圖文設計》、《創意互動設計》、《多媒體傳播》與通識課程《數位環境與媒體新素養》等課程。課程設計結合互動設計、數位策展、資訊視覺化、互動敘事與生成式 AI 應用，引導學生理解「再現」如何在技術介面中被建構、感知與操作，並培養 AI 協作環境下的內容生成、創意發想、媒體分析與批判反思能力。研究、教學與創作實踐皆圍繞「知識如何被設計、轉譯與溝通」這一核心問題，並持續探索媒體科技、互動設計、媒體素養與教育實踐之間的合作可能。",
        "researchTitle": "研究專長",
        "researchTags": [
          "媒介化研究",
          "論述分析",
          "新媒體文化",
          "媒介實踐",
          "互動媒體"
        ],
        "technicalTitle": "技術專長",
        "technicalTags": [
          "互動設計",
          "數位內容設計",
          "資料視覺化"
        ],
        "navIntro": "自我介紹",
        "navExpertise": "專長領域",
        "profileEyebrow": "Profile / 01",
        "expertiseEyebrow": "Expertise / 02"
      },
      "en": {
        "name": "Su, Kuan-Lun",
        "nameSub": "蘇冠綸",
        "introTitle": "",
        "introBody": "Su, Kuan-Lun is an interdisciplinary researcher whose work examines how media technologies shape contemporary cultural practices. His research approaches the translation, representation, and reinterpretation of knowledge, experience, and public issues through the perspectives of interaction design, media literacy, and mediatization studies. Trained in design studies and communication studies, his earlier work focused on user-centered design, interactive experience, needs analysis, and contextual inquiry, later extending these concerns to digital curation, interactive exhibition, and information interface design. He previously worked in a research and development unit at a university library, where he participated in library transformation, digital service design, and international academic collaboration. He also took part in the Erasmus+ staff mobility program, gaining practical experience across institutional, cultural, and educational contexts. His recent research has shifted toward the relationships among media technologies, institutional practices, and cultural representation, with particular attention to how institutions, knowledge, and public issues are reorganized through discourse, interfaces, and exhibition formats in the context of AI technologies and deep mediatization.\n\nIn teaching, he has served as an instructor for design practice workshops and media literacy workshops, and has taught in communication-related departments. His courses have included Creative Graphic Design, Creative Interaction Design, Multimedia Communication, and the general education course Digital Environments and New Media Literacy. His teaching integrates interaction design, digital curation, information visualization, interactive storytelling, and generative AI applications, guiding students to understand how “representation” is constructed, perceived, and operated through technological interfaces. Across research, teaching, and creative practice, his work centers on the question of how knowledge can be designed, translated, and communicated, while continuing to explore possibilities for collaboration among media technologies, interaction design, media literacy, and educational practice.",
        "researchTitle": "Research Expertise",
        "researchTags": [
          "Mediatization Studies",
          "Discourse Analysis",
          "New Media Culture",
          "Media Practices",
          "Interactive Media"
        ],
        "technicalTitle": "Technical Expertise",
        "technicalTags": [
          "Interaction Design",
          "Digital Content Design",
          "Data Visualization"
        ],
        "navIntro": "Biography",
        "navExpertise": "Expertise",
        "profileEyebrow": "Profile / 01",
        "expertiseEyebrow": "Expertise / 02"
      }
    };

    const tabs = document.querySelectorAll(".tab");
    const langButtons = document.querySelectorAll(".lang-btn");
    const paperContent = document.querySelector("#paperContent");
    const eyebrow = document.querySelector("#eyebrow");
    const siteName = document.querySelector("#siteName");
    const siteDesc = document.querySelector("#siteDesc");
    const navIntro = document.querySelector("#navIntro");
    const navExpertise = document.querySelector("#navExpertise");

    let currentView = "intro";
    let currentLang = "zh";
    let isAnimating = false;

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function tagsHtml(tags) {
      return tags.map(tag => `<span class="keyword">${escapeHtml(tag)}</span>`).join("");
    }

    function applyLanguageClass() {
      document.body.classList.toggle("lang-zh", currentLang === "zh");
      document.body.classList.toggle("lang-en", currentLang === "en");
      document.documentElement.lang = currentLang === "zh" ? "zh-Hant" : "en";
    }

    function renderShellText() {
      const data = contentData[currentLang];
      siteName.textContent = data.name;
      siteDesc.innerHTML = `${escapeHtml(data.nameSub)}<div class="school-line"></div><span class="school-name">National Chengchi University</span>`;
      navIntro.textContent = data.navIntro;
      navExpertise.textContent = data.navExpertise;
      applyLanguageClass();
    }

    function renderContent() {
      const data = contentData[currentLang];
      eyebrow.textContent = currentView === "intro" ? data.profileEyebrow : data.expertiseEyebrow;

      paperContent.innerHTML = `
        <div id="section-intro" style="padding-bottom: 80px;">
          <h1>${escapeHtml(data.introTitle)}</h1>
          <p class="body-copy">${escapeHtml(data.introBody)}</p>
        </div>
        <div id="section-expertise" style="padding-bottom: 80px;">
          <section class="expertise-block" style="border-top: 0; padding-top: 0;">
            <h2 class="expertise-title">${escapeHtml(data.researchTitle)}</h2>
            <div class="keywords">${tagsHtml(data.researchTags)}</div>
          </section>
          <section class="expertise-block">
            <h2 class="expertise-title">${escapeHtml(data.technicalTitle)}</h2>
            <div class="keywords">${tagsHtml(data.technicalTags)}</div>
          </section>
        </div>
      `;
    }

    function updateActiveStates() {
      tabs.forEach(tab => tab.classList.toggle("is-active", tab.dataset.view === currentView));
      langButtons.forEach(btn => btn.classList.toggle("is-active", btn.dataset.lang === currentLang));
    }

    function switchView(viewName) {
      if (viewName === currentView) return;
      currentView = viewName;
      updateActiveStates();

      const data = contentData[currentLang];
      eyebrow.textContent = currentView === "intro" ? data.profileEyebrow : data.expertiseEyebrow;

      const targetEl = document.getElementById("section-" + currentView);
      if (targetEl) {
        // Check if we are on mobile (where paperContent is not scrollable)
        const isMobile = window.innerWidth <= 860;
        
        if (isMobile) {
          const yOffset = -20; // Some top padding
          const y = targetEl.getBoundingClientRect().top + window.pageYOffset + yOffset;
          window.scrollTo({ top: y, behavior: 'smooth' });
        } else {
          paperContent.scrollTo({
            top: targetEl.offsetTop - paperContent.offsetTop,
            behavior: 'smooth'
          });
        }
      }

      // We still explicitly set canvas state on click for immediate feedback
      if (viewName === "expertise") {
        setCanvasState("matrix");
      } else {
        setCanvasState("organic");
      }
    }

    function switchLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      renderShellText();
      updateActiveStates();
      
      const targetEl = document.getElementById("section-" + currentView);
      const scrollTop = paperContent.scrollTop;
      renderContent();
      paperContent.scrollTop = scrollTop; // preserve scroll position
    }

    tabs.forEach(tab => tab.addEventListener("click", () => switchView(tab.dataset.view)));
    langButtons.forEach(btn => btn.addEventListener("click", () => switchLang(btn.dataset.lang)));


    /* =========================================
       CANVAS BACKGROUND: INTERACTIVE DATA CONSTELLATION
       ========================================= */
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    let width, height;
    let nodes = [];
    let canvasState = "organic"; // "organic" or "matrix"

    const mouse = { x: -1000, y: -1000, radius: 150 };

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    
    window.addEventListener("mouseleave", () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initNodes();
    }
    window.addEventListener("resize", resize);

    class Node {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 2 + 1;
        this.baseX = this.x;
        this.baseY = this.y;
        this.matrixTargetX = 0;
        this.matrixTargetY = 0;
      }

      update() {
        // Interaction with mouse
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < mouse.radius) {
          const forceDirectionX = dx / distance;
          const forceDirectionY = dy / distance;
          const force = (mouse.radius - distance) / mouse.radius;
          const pushX = forceDirectionX * force * 2;
          const pushY = forceDirectionY * force * 2;
          this.x -= pushX;
          this.y -= pushY;
        }

        if (canvasState === "organic") {
          // Slowly drift
          this.x += this.vx;
          this.y += this.vy;

          // Bounce off edges smoothly
          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;
          
          // Gently pull back to base to prevent total scattering
          this.baseX += this.vx;
          this.baseY += this.vy;
          this.x += (this.baseX - this.x) * 0.05;
          this.y += (this.baseY - this.y) * 0.05;

        } else if (canvasState === "matrix") {
          // Lerp to matrix target
          this.x += (this.matrixTargetX - this.x) * 0.05;
          this.y += (this.matrixTargetY - this.y) * 0.05;
          
          // Slowly drift the matrix target itself
          this.matrixTargetX += this.vx * 0.5;
          this.matrixTargetY += this.vy * 0.5;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(98, 66, 54, 0.4)";
        ctx.fill();
      }
    }

    function initNodes() {
      nodes = [];
      const nodeCount = Math.floor((width * height) / 12000); // responsive count
      const cols = Math.ceil(Math.sqrt(nodeCount * (width / height)));
      const rows = Math.ceil(nodeCount / cols);
      
      const xStep = width / cols;
      const yStep = height / rows;

      for (let i = 0; i < nodeCount; i++) {
        const node = new Node();
        // Assign a grid position for matrix mode
        const col = i % cols;
        const row = Math.floor(i / cols);
        node.matrixTargetX = col * xStep + (xStep / 2) + (Math.random() - 0.5) * 20;
        node.matrixTargetY = row * yStep + (yStep / 2) + (Math.random() - 0.5) * 20;
        nodes.push(node);
      }
    }

    function connectNodes() {
      const maxDistance = 120;
      for (let a = 0; a < nodes.length; a++) {
        for (let b = a; b < nodes.length; b++) {
          let dx = nodes[a].x - nodes[b].x;
          let dy = nodes[a].y - nodes[b].y;
          let distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < maxDistance) {
            let opacity = 1 - (distance / maxDistance);
            ctx.beginPath();
            ctx.strokeStyle = `rgba(98, 66, 54, ${opacity * 0.25})`;
            ctx.lineWidth = 1;
            ctx.moveTo(nodes[a].x, nodes[a].y);
            ctx.lineTo(nodes[b].x, nodes[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < nodes.length; i++) {
        nodes[i].update();
        nodes[i].draw();
      }
      connectNodes();
      requestAnimationFrame(animateCanvas);
    }

    function setCanvasState(state) {
      canvasState = state;
      if (state === "organic") {
        // When returning to organic, set current positions as new base
        nodes.forEach(node => {
          node.baseX = node.x;
          node.baseY = node.y;
        });
      } else {
        // When going to matrix, re-assign grid to current dimensions
        const cols = Math.ceil(Math.sqrt(nodes.length * (width / height)));
        const xStep = width / cols;
        const yStep = height / Math.ceil(nodes.length / cols);
        
        nodes.forEach((node, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          // slight offset so it looks like data points
          node.matrixTargetX = col * xStep + (xStep / 2) + (Math.random() - 0.5) * 30;
          node.matrixTargetY = row * yStep + (yStep / 2) + (Math.random() - 0.5) * 30;
        });
      }
    }

    window.addEventListener("load", () => {
      renderShellText();
      renderContent();
      updateActiveStates();

      gsap.from(".tab", { x: -18, opacity: 0, stagger: 0.08, duration: 0.62, ease: "power2.out" });
      gsap.from(".paper", { y: 18, opacity: 0, duration: 0.78, ease: "power2.out" });
      
      resize();
      animateCanvas();
      
      gsap.from("#bg-canvas", { opacity: 0, duration: 1.5, ease: "power2.out" });

      // Setup Scroll Spy using IntersectionObserver
      const observerOptions = {
        root: null,
        rootMargin: "-20% 0px -40% 0px",
        threshold: 0
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            if (id === "section-intro" && canvasState !== "organic") {
              setCanvasState("organic");
              currentView = "intro";
              updateActiveStates();
              eyebrow.textContent = contentData[currentLang].profileEyebrow;
            } else if (id === "section-expertise" && canvasState !== "matrix") {
              setCanvasState("matrix");
              currentView = "expertise";
              updateActiveStates();
              eyebrow.textContent = contentData[currentLang].expertiseEyebrow;
            }
          }
        });
      }, observerOptions);

      // We need a small delay so the DOM is fully injected by renderContent
      setTimeout(() => {
        const introSection = document.getElementById("section-intro");
        const expertiseSection = document.getElementById("section-expertise");
        if (introSection) observer.observe(introSection);
        if (expertiseSection) observer.observe(expertiseSection);
      }, 100);
    });
  </script>
</body>
</html>
