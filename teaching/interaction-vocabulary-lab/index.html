<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>互動設計關鍵字實驗室｜互動式參考書</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>

  <style>
    :root{
      --sidebar-w: 300px;
      --ink:#24324a;
      --muted:#6f7b91;
      --line:#dbe5f3;
      --bg:#f7fbff;
      --surface:#ffffff;
      --primary:#4f7cff;
      --primary-soft:#eaf0ff;
      --secondary:#ff9f68;
      --secondary-soft:#fff0e6;
      --mint:#54c6a2;
      --mint-soft:#e7f8f2;
      --yellow:#ffd66b;
      --shadow:0 10px 30px rgba(75,105,160,.10);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMac系統Font, "Segoe UI", sans-serif;
      color:var(--ink);
      background:var(--bg);
      overflow:hidden;
    }
    .app{
      height:100vh;
      display:grid;
      grid-template-columns:var(--sidebar-w) 1fr;
    }
    .sidebar{
      border-right:1px solid var(--line);
      background:#f1f6ff;
      padding:18px 14px;
      overflow:auto;
    }
    .brand{
      font-weight:800;
      letter-spacing:-.02em;
      font-size:1.1rem;
      margin-bottom:4px;
    }
    .brand-sub{
      font-size:.78rem;
      color:var(--muted);
      margin-bottom:16px;
    }
    .search-wrap{
      position:sticky;
      top:0;
      background:#f1f6ff;
      padding-bottom:10px;
      z-index:5;
    }
    .search{
      border-radius:999px;
      padding:.65rem .85rem;
      font-size:.9rem;
    }
    .group-title{
      margin:18px 8px 7px;
      font-size:.68rem;
      color:#8b8f96;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-weight:700;
    }
    .nav-item-btn{
      width:100%;
      border:0;
      background:transparent;
      padding:9px 10px;
      border-radius:10px;
      text-align:left;
      font-size:.9rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .nav-item-btn:hover{background:#e3ebff}
    .nav-item-btn.active{
      background:var(--primary);
      color:#fff;
    }
    .nav-item-btn .tag{
      font-size:.64rem;
      opacity:.55;
    }

    .main{
      overflow:auto;
      min-width:0;
      background:#fff;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      height:64px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.96);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px;
    }
    .topbar .crumb{
      font-size:.8rem;
      color:var(--muted);
    }
    .content{
      width:min(1100px,calc(100% - 48px));
      margin:0 auto;
      padding:34px 0 80px;
    }
    .hero{
      margin-bottom:26px;
    }
    .eyebrow{
      font-size:.72rem;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#70757d;
      margin-bottom:8px;
    }
    .title{
      font-size:clamp(2rem,5vw,4.7rem);
      line-height:.95;
      letter-spacing:-.055em;
      font-weight:850;
      margin:0 0 14px;
    }
    .lead{
      max-width:780px;
      font-size:1.05rem;
      color:#5f646b;
      line-height:1.7;
    }
    .keyword-pill{
      display:inline-flex;
      align-items:center;
      border:1px solid var(--line);
      border-radius:999px;
      padding:.35rem .65rem;
      margin:0 .35rem .35rem 0;
      font-size:.75rem;
      background:var(--primary-soft);
      border-color:#cbd8ff;
      color:#3557b7;
    }

    .demo-card,.prompt-card,.notes-card{
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--bg);
      overflow:hidden;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }
    .card-head{
      padding:14px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#f6f9ff;
    }
    .card-head strong{
      font-size:.9rem;
    }
    .card-bodyx{
      padding:24px;
    }
    .demo-stage{
      min-height:290px;
      border-radius:14px;
      border:1px dashed #cfd3d8;
      background:linear-gradient(135deg,#ffffff,#f2f7ff 55%,#fff7ef);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      position:relative;
      overflow:hidden;
    }
    .prompt-box{
      width:100%;
      min-height:130px;
      border:0;
      outline:0;
      resize:vertical;
      font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:.88rem;
      line-height:1.65;
      background:#26344f;
      color:#f8fbff;
      padding:18px;
      border-radius:12px;
    }
    .copy-btn{
      border-radius:999px;
    }
    .tiny{
      font-size:.75rem;
      color:var(--muted);
    }
    .demo-label{
      position:absolute;
      left:14px;
      top:12px;
      font-size:.7rem;
      color:#9ca1a8;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    /* Demo primitives */
    .box{
      width:110px;height:110px;
      border-radius:18px;
      background:var(--primary);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      cursor:pointer;
    }
    .ghost-zone{
      width:180px;height:140px;
      border:2px dashed #bbb;
      border-radius:18px;
      display:flex;align-items:center;justify-content:center;
      color:#888;
      transition:.2s;
    }
    .ghost-zone.hot{border-color:#111;background:#f0f0f0;color:#111}
    .draggable{
      touch-action:none;
      cursor:grab;
      position:relative;
      z-index:2;
    }
    .draggable:active{cursor:grabbing}
    .resize-box{
      width:180px;height:120px;resize:both;overflow:auto;
      border:2px solid #111;border-radius:16px;padding:14px;
      background:white;
    }
    .sortable-list{width:min(100%,380px);margin:0;padding:0;list-style:none}
    .sortable-list li{
      padding:12px 14px;border:1px solid var(--line);background:white;
      margin-bottom:8px;border-radius:12px;cursor:grab;
    }
    .selected-demo .selectable-item{
      padding:12px 14px;border:1px solid var(--line);border-radius:12px;
      margin:5px;display:inline-block;cursor:pointer;
    }
    .selected-demo .selectable-item.selected{background:var(--primary);color:#fff}
    .hover-card{
      width:220px;height:140px;border-radius:18px;border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;
      transition:.25s;background:white;
    }
    .hover-card:hover{
      transform:translateY(-8px) scale(1.03);
      box-shadow:0 16px 34px rgba(0,0,0,.12);
    }
    .scroll-box{
      height:210px;overflow:auto;border:1px solid var(--line);
      border-radius:14px;padding:14px;width:min(100%,520px);background:white;
    }
    .scroll-block{
      height:110px;border-radius:12px;background:#f1f3f5;
      margin-bottom:12px;display:flex;align-items:center;justify-content:center;
    }
    .kbd-demo{
      width:min(100%,520px);
    }
    .kbd-output{
      min-height:80px;padding:16px;border:1px solid var(--line);border-radius:12px;
      margin-top:12px;background:#f6f9ff;
    }
    .meter{
      width:min(100%,520px);
    }
    .range-label{font-size:.8rem;color:var(--muted)}
    .toast-host{
      position:absolute;right:18px;bottom:18px;z-index:3;
    }
    .carousel-simple{
      width:min(100%,560px);
    }
    .carousel-slide{
      height:230px;border-radius:16px;
      display:flex;align-items:center;justify-content:center;
      font-size:2rem;font-weight:800;
      background:#f2f3f5;
    }
    .tab-panels .nav-link{color:#111}
    .tab-panels .nav-link.active{font-weight:700}
    .tooltip-sample{
      border-bottom:1px dotted #111;cursor:help;
    }
    .fake-sidebar{
      width:100%;height:240px;position:relative;overflow:hidden;
      border:1px solid var(--line);border-radius:14px;background:#f6f9ff;
    }
    .fake-panel{
      position:absolute;top:0;bottom:0;left:0;width:220px;
      background:var(--primary);color:#fff;padding:18px;transform:translateX(-100%);
      transition:.28s ease;
    }
    .fake-panel.open{transform:translateX(0)}
    .fake-content{padding:24px 24px 24px 260px;transition:.28s}
    .progress{height:20px}
    .p5-wrap,.three-wrap{
      width:min(100%,720px);
      height:360px;
      border-radius:16px;
      overflow:hidden;
      background:#f3f4f6;
      position:relative;
    }
    .tool-card{
      width:min(100%,700px);
      border:1px solid var(--line);
      border-radius:18px;
      padding:22px;
      background:white;
    }
    .tool-card h3{margin-top:0}
    .tool-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
    }
    .tool-chip{
      padding:10px 12px;border:1px solid var(--line);
      border-radius:12px;background:#f6f9ff;font-size:.86rem;
    }
    .mini-steps{
      display:flex;gap:8px;flex-wrap:wrap;align-items:center;
      margin:10px 0 18px;
    }
    .mini-step{
      padding:.46rem .76rem;border-radius:999px;
      background:var(--secondary-soft);font-size:.78rem;color:#9b562f;font-weight:700;
    }
    .arrow{color:#adb1b6}
    @media (max-width: 880px){
      body{overflow:auto}
      .app{grid-template-columns:1fr;height:auto}
      .sidebar{
        position:sticky;top:0;z-index:20;
        border-right:0;border-bottom:1px solid var(--line);
        max-height:42vh;
      }
      .main{overflow:visible}
      .topbar{top:42vh}
      .content{width:min(100% - 28px,1100px)}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">互動設計關鍵字實驗室</div>
    <div class="brand-sub">從人的操作，找到可以交給 AI 的互動語彙</div>

    <div class="search-wrap">
      <input id="searchInput" class="form-control search" placeholder="搜尋關鍵字…" />
    </div>

    <div id="nav"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb">互動設計基礎</div>
      </div>
      <div class="tiny">操作 → 行為 → 元件 → 工具</div>
    </div>

    <div class="content">
      <section id="hero" class="hero"></section>

      <div class="mini-steps">
        <span class="mini-step">1. 人的操作</span><span class="arrow">→</span>
        <span class="mini-step">2. 互動行為</span><span class="arrow">→</span>
        <span class="mini-step">3. 介面元件</span><span class="arrow">→</span>
        <span class="mini-step">4. 可選工具</span>
      </div>

      <section class="demo-card">
        <div class="card-head">
          <strong>操作示範</strong>
          <span class="tiny" id="techBadge"></span>
        </div>
        <div class="card-bodyx">
          <div id="demoStage" class="demo-stage">
            <div class="demo-label">請操作看看</div>
          </div>
        </div>
      </section>

      <section class="prompt-card">
        <div class="card-head">
          <strong>填空式 Prompt</strong>
          <button id="copyPrompt" class="btn btn-sm btn-dark copy-btn">複製</button>
        </div>
        <div class="card-bodyx">
          <div class="tiny mb-2">把中括號內容換成你的條件，再交給 AI。</div>
          <textarea id="promptBox" class="prompt-box" spellcheck="false"></textarea>
        </div>
      </section>

      <section class="notes-card">
        <div class="card-head"><strong>觀察重點</strong></div>
        <div class="card-bodyx" id="notes"></div>
      </section>
    </div>
  </main>
</div>

<script>
const ITEMS = [
  // hidden:true = 暫時隱藏於左側選單，但保留資料，之後可重新開啟。
  /* HUMAN INPUT */
  {group:"基本操作", id:"tap", title:"Tap / Click", tag:"操作",
   desc:"最基本的觸發：使用者點一下物件，系統執行一個明確動作。",
   keywords:["tap","click","button","activate"],
   tech:"HTML + JavaScript",
   prompt:"當使用者 [點擊／輕觸] [物件名稱] 時，請讓 [目標物件] 執行 [顯示／隱藏／切換狀態／移動到某處]，並以 [顏色／文字／動畫] 提供回饋。",
   notes:"重點不是「有按鈕」，而是要說清楚：誰被點、點了之後什麼改變、使用者怎麼知道系統有收到。",
   demo:"tap"},
  {group:"基本操作", id:"double-click", title:"Double Click / Double Tap", tag:"操作",
   desc:"短時間內連續觸發兩次，適合用在放大、快速開啟或特殊模式。",
   keywords:["double click","double tap","zoom"],
   tech:"HTML + JavaScript",
   prompt:"當使用者在 [物件名稱] 上快速 [雙擊／雙點] 時，請將它 [放大／進入編輯模式／切換顯示內容]；再次雙擊時 [恢復原狀]。",
   notes:"雙擊不適合拿來當唯一操作入口，因為它的可見性較低；可作為次要互動。",
   demo:"double"},
  {group:"基本操作", id:"long-press", title:"Long Press / Press and Hold", tag:"操作",
   desc:"按住一段時間後才觸發，適合叫出次要操作或進入特殊模式。",
   keywords:["long press","hold","press and hold"],
   tech:"JavaScript",
   prompt:"當使用者按住 [物件名稱] 超過 [毫秒數，例如 700ms] 時，請觸發 [功能]；按住期間顯示 [進度／縮放／顏色變化] 作為回饋。",
   notes:"這是一個時間型觸發。務必讓使用者在等待期間看得到回饋。",
   demo:"hold"},
  {group:"基本操作", id:"drag", title:"Touch / Click + 拖曳", tag:"操作",
   desc:"按住不放並移動。它是很多創意互動的基本骨架。",
   keywords:["drag","touch drag","mouse drag"],
   tech:"JavaScript",
   prompt:"讓 [物件名稱] 可以被拖曳。拖曳開始時 [回饋]，拖曳過程中讓物件 [跟隨游標／手指]，放開時 [停在原位／回彈／吸附到最近位置]。",
   notes:"拖曳 可以拆成 Press → Move → Release。Storyboard 畫這三格，AI 通常更容易理解。",
   demo:"drag"},
  {group:"基本操作", id:"swipe", title:"Swipe", tag:"操作", hidden:true,
   desc:"帶有方向性的快速拖移，常見於卡片切換、圖片瀏覽、刪除手勢。",
   keywords:["swipe","gesture","left","right"],
   tech:"JavaScript",
   prompt:"當使用者在 [卡片／圖片] 上向 [左／右／上／下] swipe 超過 [距離] 時，請執行 [下一張／刪除／切換內容]，並加入 [滑出／回彈] 動畫。",
   notes:"Swipe 的關鍵是方向與距離門檻，而不是單純 drag。",
   demo:"swipe"},
  {group:"基本操作", id:"pinch", title:"Pinch / Spread", tag:"操作", hidden:true,
   desc:"雙指縮放手勢。是否能完整控制，會依瀏覽器與裝置機制而異。",
   keywords:["pinch","spread","zoom","mobile gesture"],
   tech:"Device / Browser dependent",
   prompt:"如果裝置支援多點觸控，請讓使用者以雙指 [pinch / spread] 控制 [物件] 的縮放，限制縮放範圍在 [最小值] 到 [最大值]。",
   notes:"這個互動部分依賴裝置與瀏覽器機制。課堂上可先把它視為 optional。",
   demo:"pinch"},
  {group:"基本操作", id:"hover", title:"Hover", tag:"操作",
   desc:"滑鼠停留在物件上時出現狀態變化，適合 preview、提示與強調。",
   keywords:["hover","mouseover","preview"],
   tech:"CSS / JavaScript",
   prompt:"當滑鼠 hover 在 [物件名稱] 上時，請讓它 [放大／浮起／顯示資訊／改變顏色]；滑鼠離開後恢復原狀。",
   notes:"Hover 在觸控裝置上不可靠，所以不要把必要資訊只藏在 hover 裡。",
   demo:"hover"},
  {group:"基本操作", id:"scroll", title:"Scroll", tag:"操作",
   desc:"捲動本身也能作為觸發條件，例如 reveal、parallax 或載入更多內容。",
   keywords:["scroll","scroll trigger","reveal"],
   tech:"CSS + JavaScript",
   prompt:"當使用者捲動到 [指定區塊／百分比] 時，觸發 [淡入／位移／計數／載入下一段內容]，並保持動畫 [快／慢／平滑]。",
   notes:"Scroll 是位置型觸發：何時進入視窗、進入多少，都可以成為條件。",
   demo:"scroll"},
  {group:"基本操作", id:"keyboard", title:"Keyboard Input", tag:"操作",
   desc:"使用按鍵、方向鍵、Enter、Space 等觸發互動。",
   keywords:["keyboard","keypress","enter","arrow keys"],
   tech:"JavaScript",
   prompt:"當使用者按下 [按鍵，例如 Enter / ArrowLeft / Space] 時，讓 [物件] 執行 [動作]，並顯示 [視覺回饋]。",
   notes:"鍵盤互動是可用性與無障礙的重要部分，也能用於遊戲或創意控制。",
   demo:"keyboard"},
  {group:"基本操作", id:"text-input", title:"Text Input", tag:"操作",
   desc:"讓使用者輸入文字、數字或關鍵字，再觸發搜尋、回應或內容生成。",
   keywords:["text input","input","search","type"],
   tech:"HTML + JavaScript",
   prompt:"建立一個 [文字／數字] 輸入欄位。使用者輸入 [內容類型] 後，按下 [Enter／按鈕]，請將輸入值用來 [搜尋／計算／更新畫面內容]。",
   notes:"Input 不只是表單，也可以成為創意互動的變數來源。",
   demo:"input"},

  /* BEHAVIOR */
  {group:"互動行為", id:"draggable", title:"Draggable", tag:"行為",
   desc:"物件可以被抓起來拖動。",
   keywords:["draggable","move object"],
   tech:"jQuery + JavaScript",
   prompt:"讓 [物件名稱] 成為 draggable。拖曳時 [跟隨游標／限制在指定區域]，放開後 [保留位置／回到原位]。",
   notes:"把「可以拖」跟「拖到哪裡後發生什麼」分開描述。",
   demo:"drag"},
  {group:"互動行為", id:"droppable", title:"Droppable", tag:"行為",
   desc:"某個區域可以接收被拖進來的物件。",
   keywords:["droppable","drop zone","drag and drop"],
   tech:"JavaScript",
   prompt:"讓 [物件 A] 可以拖曳，讓 [區域 B] 成為 drop zone。當 A 被放進 B 時，請 [改變狀態／加入清單／消失／播放動畫]。",
   notes:"Droppable 是 拖曳 + Release + Target 的組合。",
   demo:"drop"},
  {group:"互動行為", id:"resizable", title:"Resizable", tag:"行為",
   desc:"使用者可以改變物件寬度、高度或兩者。",
   keywords:["resizable","resize","handle"],
   tech:"CSS / JavaScript",
   prompt:"讓 [面板／圖片／區塊] 可以由 [右下角／邊緣] 拖曳改變大小，限制尺寸在 [最小] 到 [最大]。",
   notes:"如果 resize 是核心操作，要讓 handle 看起來真的「可拉」。",
   demo:"resize"},
  {group:"互動行為", id:"selectable", title:"Selectable", tag:"行為",
   desc:"物件可以被單選或多選。",
   keywords:["selectable","select","multi-select"],
   tech:"JavaScript",
   prompt:"讓 [一組物件] 可以被選取。點擊後使用 [外框／背景色／勾選符號] 表示 selected state；設定為 [單選／多選]。",
   notes:"Selected 是一種 state，回饋要清楚。",
   demo:"select"},
  {group:"互動行為", id:"sortable", title:"Sortable", tag:"行為",
   desc:"直接拖曳項目，改變清單中的實際排列順序。",
   keywords:["sortable","reorder"],
   tech:"JavaScript",

const nav = document.getElementById("nav");
const hero = document.getElementById("hero");
const stage = document.getElementById("demoStage");
const promptBox = document.getElementById("promptBox");
const notes = document.getElementById("notes");
const techBadge = document.getElementById("techBadge");
const crumb = document.getElementById("crumb");

let currentId = "tap";
let p5Instance = null;
let threeAnim = null;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]))}

function renderNav(filter=""){
  nav.innerHTML="";
  const q = filter.toLowerCase().trim();
  const groups = [...new Set(ITEMS.map(x=>x.group))];
  for(const g of groups){
    const matches = ITEMS.filter(x=>!x.hidden && x.group===g && (
      !q || x.title.toLowerCase().includes(q) ||
      x.keywords.join(" ").toLowerCase().includes(q) ||
      x.desc.toLowerCase().includes(q)
    ));
    if(!matches.length) continue;
    const t=document.createElement("div");
    t.className="group-title"; t.textContent=g;
    nav.appendChild(t);
    matches.forEach(item=>{
      const b=document.createElement("button");
      b.className="nav-item-btn"+(item.id===currentId?" active":"");
      b.innerHTML=`<span>${esc(item.title)}</span><span class="tag">${esc(item.tag)}</span>`;
      b.onclick=()=>selectItem(item.id);
      nav.appendChild(b);
    });
  }
}

function selectItem(id){
  currentId=id;
  const item=ITEMS.find(x=>x.id===id) || ITEMS[0];
  cleanup();
  renderNav(document.getElementById("searchInput").value);
  crumb.textContent=`${item.group} / ${item.title}`;
  hero.innerHTML=`
    <div class="eyebrow">${esc(item.tag)} · ${esc(item.group)}</div>
    <h1 class="title">${esc(item.title)}</h1>
    <div class="lead">${esc(item.desc)}</div>
    <div class="mt-3">${item.keywords.map(k=>`<span class="keyword-pill">${esc(k)}</span>`).join("")}</div>
  `;
  techBadge.textContent=item.tech;
  promptBox.value=item.prompt;
  notes.innerHTML=`<p class="mb-0">${esc(item.notes)}</p>`;

  const promptCard=document.querySelector(".prompt-card");
  const notesCard=document.querySelector(".notes-card");
  const isAnnotation=item.id==="annotation-guide";
  if(promptCard) promptCard.style.display=isAnnotation?"none":"";
  if(notesCard) notesCard.style.display=isAnnotation?"none":"";

  renderDemo(item.demo);
}

function cleanup(){
  document.querySelectorAll('[data-bs-toggle="popover"]').forEach(el=>{
    const instance=bootstrap.Popover.getInstance(el);
    if(instance) instance.dispose();
  });
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el=>{
    const instance=bootstrap.Tooltip.getInstance(el);
    if(instance) instance.dispose();
  });
  document.querySelectorAll('.popover,.tooltip').forEach(el=>el.remove());
  if(p5Instance){ p5Instance.remove(); p5Instance=null; }
  if(threeAnim){ cancelAnimationFrame(threeAnim); threeAnim=null; }
}

function resetStage(){
  stage.innerHTML='<div class="demo-label">請操作看看</div>';
}

function renderDemo(type){
  resetStage();

  const add=(html)=>stage.insertAdjacentHTML("beforeend",html);

  if(type==="tap"){
    add(`<button id="tapBtn" class="btn btn-dark btn-lg">點我</button>
         <div id="tapMsg" class="ms-3 fw-semibold">等待操作</div>`);
    $("#tapBtn").on("click",()=>$("#tapMsg").text("已觸發 ✓"));
  }
  else if(type==="double"){
    add(`<div id="dblBox" class="box">雙擊看看</div>`);
    $("#dblBox").on("dblclick",function(){
      $(this).toggleClass("big").css("transform", $(this).hasClass("big")?"scale(1.35)":"scale(1)");
    });
  }
  else if(type==="hold"){
    add(`<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center">
      <div id="holdBox" class="box" style="touch-action:none;position:relative;overflow:hidden">
        <div id="holdFill" style="position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(255,255,255,.22);pointer-events:none"></div>
        <span id="holdLabel" style="position:relative;z-index:2">按住 1 秒</span>
      </div>
      <div id="holdMsg" style="min-width:92px;font-weight:700;color:#526585">尚未觸發</div>
    </div>`);
    const el=document.getElementById("holdBox");
    const label=document.getElementById("holdLabel");
    const fill=document.getElementById("holdFill");
    const msg=document.getElementById("holdMsg");
    let pressing=false, startTime=0, raf=0;
    const duration=1000;

    function reset(text="尚未觸發"){
      pressing=false;
      cancelAnimationFrame(raf);
      fill.style.height="0%";
      label.textContent="按住 1 秒";
      msg.textContent=text;
    }

    function tick(now){
      if(!pressing) return;
      const p=Math.min(1,(now-startTime)/duration);
      fill.style.height=(p*100)+"%";
      msg.textContent=Math.round(p*100)+"%";
      if(p>=1){
        pressing=false;
        label.textContent="已觸發 ✓";
        msg.textContent="Long Press 成功";
        fill.style.height="100%";
        if(navigator.vibrate) navigator.vibrate(35);
        return;
      }
      raf=requestAnimationFrame(tick);
    }

    el.addEventListener("pointerdown",e=>{
      e.preventDefault();
      el.setPointerCapture?.(e.pointerId);
      pressing=true;
      startTime=performance.now();
      label.textContent="繼續按住…";
      msg.textContent="0%";
      raf=requestAnimationFrame(tick);
    });

    const stop=e=>{
      if(!pressing) return;
      el.releasePointerCapture?.(e.pointerId);
      reset("太早放開");
    };
    el.addEventListener("pointerup",stop);
    el.addEventListener("pointercancel",stop);
  }

function make拖曳gable(el, dropZone=null){
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  el.style.transform="translate(0px,0px)";
  const point=e=>e.touches?e.touches[0]:e;
  const start=e=>{
    dragging=true;
    const p=point(e); sx=p.clientX; sy=p.clientY;
    const m=el.dataset.xy?el.dataset.xy.split(",").map(Number):[0,0]; ox=m[0]; oy=m[1];
    e.preventDefault?.();
  };
  const move=e=>{
    if(!dragging)return;
    const p=point(e); const x=ox+p.clientX-sx, y=oy+p.clientY-sy;
    el.dataset.xy=`${x},${y}`; el.style.transform=`translate(${x}px,${y}px)`;
    if(dropZone){
      const a=el.getBoundingClientRect(), b=dropZone.getBoundingClientRect();
      const hit=a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
      dropZone.classList.toggle("hot",hit);
    }
  };
  const end=()=>{
    if(!dragging)return; dragging=false;
    if(dropZone){
      const a=el.getBoundingClientRect(), b=dropZone.getBoundingClientRect();
      const hit=a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
      if(hit){dropZone.textContent="已放入 ✓"; el.style.opacity=".25";}
      dropZone.classList.remove("hot");
    }
  };
  el.addEventListener("mousedown",start); el.addEventListener("touchstart",start,{passive:false});
  window.addEventListener("mousemove",move); window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",end); window.addEventListener("touchend",end);
}

function makeSnap(el,grid){
  let dragging=false,sx=0,sy=0,ox=20,oy=20;
  const point=e=>e.touches?e.touches[0]:e;
  const start=e=>{dragging=true; const p=point(e); sx=p.clientX; sy=p.clientY; e.preventDefault?.();}
  const move=e=>{if(!dragging)return; const p=point(e); el.style.left=(ox+p.clientX-sx)+"px"; el.style.top=(oy+p.clientY-sy)+"px";}
  const end=()=>{if(!dragging)return; dragging=false; ox=Math.round(parseFloat(el.style.left)/grid)*grid; oy=Math.round(parseFloat(el.style.top)/grid)*grid; el.style.left=ox+"px"; el.style.top=oy+"px";}
  el.addEventListener("mousedown",start);el.addEventListener("touchstart",start,{passive:false});
  window.addEventListener("mousemove",move);window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",end);window.addEventListener("touchend",end);
}

function pointerSortable(list){
  let dragging=null;
  let placeholder=null;
  let offsetY=0;

  function refreshLabels(){
    [...list.children]
      .filter(el=>!el.classList.contains("sort-placeholder"))
      .forEach(li=>{
        li.innerHTML=`<span class="sort-handle">⋮⋮</span><span>${li.dataset.label}</span>`;
      });
  }

  function bind(li){
    li.style.touchAction="none";
    li.addEventListener("pointerdown",e=>{
      if(e.button!==0) return;
      dragging=li;
      const rect=li.getBoundingClientRect();
      offsetY=e.clientY-rect.top;

      placeholder=document.createElement("li");
      placeholder.className="sort-placeholder";
      placeholder.style.height=rect.height+"px";
      placeholder.style.border="2px dashed #9db1e8";
      placeholder.style.background="#eef3ff";
      placeholder.style.borderRadius="12px";

      list.insertBefore(placeholder, li.nextSibling);
      li.setPointerCapture?.(e.pointerId);
      li.style.position="fixed";
      li.style.zIndex="9999";
      li.style.width=rect.width+"px";
      li.style.left=rect.left+"px";
      li.style.top=rect.top+"px";
      li.style.margin="0";
      li.style.boxShadow="0 18px 38px rgba(60,78,120,.24)";
      li.style.cursor="grabbing";
      document.body.style.userSelect="none";
      e.preventDefault();
    });

    li.addEventListener("pointermove",e=>{
      if(dragging!==li) return;
      li.style.top=(e.clientY-offsetY)+"px";
      const siblings=[...list.children].filter(x=>x!==li && x!==placeholder);
      let placed=false;
      for(const s of siblings){
        const r=s.getBoundingClientRect();
        if(e.clientY < r.top + r.height/2){
          list.insertBefore(placeholder,s);
          placed=true;
          break;
        }
      }
      if(!placed) list.appendChild(placeholder);
    });

    const finish=e=>{
      if(dragging!==li) return;
      list.insertBefore(li,placeholder);
      placeholder.remove();
      placeholder=null;
      dragging=null;
      li.releasePointerCapture?.(e.pointerId);
      li.style.position="";
      li.style.zIndex="";
      li.style.width="";
      li.style.left="";
      li.style.top="";
      li.style.margin="";
      li.style.boxShadow="";
      li.style.cursor="grab";
      document.body.style.userSelect="";
      refreshLabels();
    };

    li.addEventListener("pointerup",finish);
    li.addEventListener("pointercancel",finish);
  }

  [...list.children].forEach(bind);
  refreshLabels();
}

function simpleSortable(list){ pointerSortable(list); }

function initThree(){
  const host=document.getElementById("threeCanvas");
  if(!host || !window.THREE){ host.innerHTML="<div class='p-4'>Three.js could not load.</div>"; return; }
  const w=host.clientWidth,h=host.clientHeight;
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xf3f4f6);
  const camera=new THREE.PerspectiveCamera(55,w/h,.1,100);
  camera.position.z=4;
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w,h); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  host.appendChild(renderer.domElement);
  const geo=new THREE.BoxGeometry(1.4,1.4,1.4);
  const mat=new THREE.MeshNormalMaterial();
  const cube=new THREE.Mesh(geo,mat); scene.add(cube);
  let lastX=null;
  renderer.domElement.addEventListener("pointermove",e=>{
    if(e.buttons===1 && lastX!==null) cube.rotation.y+=(e.clientX-lastX)*.01;
    lastX=e.clientX;
  });
  renderer.domElement.addEventListener("pointerup",()=>lastX=null);
  const animate=()=>{
    cube.rotation.x+=.005;
    renderer.render(scene,camera);
    threeAnim=requestAnimationFrame(animate);
  };
  animate();
}
